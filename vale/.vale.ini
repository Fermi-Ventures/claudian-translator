# Vale — the deterministic lane. Public packs plus the Team style.
#   Microsoft   sentence length, passive voice, weasel words, adverbs, wordiness
#   write-good  weasel, passive, too-wordy, clichés, weak openers
#   proselint   jargon, clichés, redundancy
#   Readability Flesch-Kincaid, Gunning Fog, SMOG, Coleman-Liau, ARI (document-level)
#   Team        semicolons, justification words, insider phrases, chatbot tells, personification
#   Slopster    vendored (MIT): a generic AI-tells lane
# Run from the repo root:  vale --config vale/.vale.ini --output=line <file.md>
# The output is an exhibit the author rewrites or defends; never a gate.
StylesPath = styles
MinAlertLevel = suggestion
Packages = Microsoft, write-good, proselint, Readability

[*.md]
BasedOnStyles = Vale, Microsoft, write-good, proselint, Readability, Team, Slopster
# The rules are read as rules, not as consumer docs: contractions and
# first person are not defects here; headings are not sentences.
Microsoft.Contractions = NO
Microsoft.We = NO
Microsoft.FirstPerson = NO
Microsoft.Headings = NO
Microsoft.HeadingAcronyms = NO
Microsoft.Ellipses = NO
Microsoft.Dashes = NO
Vale.Spelling = NO
# Noise for rule text, switched off after the first run on a rule: "avoid is" fires on every definition; the A-Z vocabulary and the
# Oxford comma are consumer-doc style, not hygiene; "it is" is not wordy in a
# rule. Passive stays as a suggestion: "is announced at review" is the
# NO-AGENT question (announced by whom?) and the owner should answer it once.
write-good.E-Prime = NO
write-good.TooWordy = NO
Microsoft.Vocab = NO
Microsoft.OxfordComma = NO
Microsoft.Passive = suggestion
write-good.Passive = NO
Microsoft.Semicolon = NO
# "agent" → "personal digital assistant" is Microsoft's product vocabulary, not ours.
Microsoft.Terms = NO
# Kept ON deliberately: Readability (document-level grade/ease), SentenceLength,
# Passive (as suggestion), Adverbs, Acronyms (TTL, DDL undefined = writing rule 3),
# Uppercase (CAPS for emphasis is a tone the ratifier has called out), and Team.*
# Slopster (vendored, MIT): the generic AI-tells lane. Its BannedWords regex quiet\w* / sharp\w* is over-broad for rule text ("never made quietly"); demoted to suggestion. EmDash counts per paragraph; rule text uses dashes as definition separators — warning stays.
Slopster.BannedWords = suggestion
