  - "toe the line"
  - "ride roughshod"
  - "stand shoulder to shoulder"
  - "play into the hands of"
  - "an axe to grind"
  - "grist to the mill"
  - "fishing in troubled waters"
  - "on the order of the day"
  - "Achilles.? heel"
  - "swan song"
  - "hotbed of"
  - "no stone unturned"
  - "low-hanging fruit"
  - "level playing field"
  - "move the needle"
  - "boil the ocean"
  - "double-edged sword"
  - "tip of the iceberg"
  - "perfect storm"
  - "sea change"
  - "silver bullet"
  - "elephant in the room"
  - "needle in a haystack"
  - "tectonic shift"
  - "north star"
  - "table stakes"
  - "force multiplier"
  - "when the rubber (meets|hits) the road"
  - "at a crossroads"
  - "uncharted (waters|territory)"
  - "a double.edged"
  - "the writing (is|was) on the wall"
